<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop Digest — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-box">
    <h1>Your Stores</h1>
    <p class="subtitle">Connect a store to start getting digests.</p>

    <p id="status">No stores connected yet.</p>

    <button id="connectPrintifyBtn">+ Connect Printify</button>

    <div id="printifyForm" style="display:none; margin-top:12px;">
      <label for="printifyToken">Printify API Token</label>
      <input type="text" id="printifyToken" placeholder="Paste your token here">
      <button id="savePrintifyBtn">Save</button>
    </div>
  </div>

<button id="sendDigestBtn">Email me this digest now</button>

  <script src="dashboard.js"></script>
</body>
</html>
