<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop Digest — Log In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-box">
    <h1>Shop Digest</h1>
    <p class="subtitle">Weekly updates from your Etsy & Printify stores.</p>

    <form id="authForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" id="loginBtn">Log In</button>
      <button type="button" id="registerBtn">Register instead</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
