<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sellytics — Log In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sellytics">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-box">
    <h1>Sellytics</h1>
    <p class="subtitle">Weekly updates from your Etsy & Printify stores.</p>

    <form id="authForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <!-- formnovalidate: logging in must not require the consent
           checkbox, which is required for registration only -->
      <button type="submit" id="loginBtn" formnovalidate>Log In</button>
      <button type="button" id="registerBtn">Register instead</button>

      <!-- Starts UNCHECKED and is required: registration is blocked
           (client-side and server-side) until it is ticked -->
      <label class="consent" for="agreeTerms">
        <input type="checkbox" id="agreeTerms" required>
        <span>I agree to the
          <a href="/terms.html">Terms</a> and
          <a href="/privacy.html">Privacy Policy</a>
        </span>
      </label>
    </form>

    <p id="message"></p>
  </div>

  <footer class="site-footer">
    <nav>
      <a href="/privacy.html">Privacy</a> ·
      <a href="/terms.html">Terms</a> ·
      <a href="/impressum.html">Impressum</a>
    </nav>
    <p>Support: <a href="mailto:support.sellytics@gmail.com" data-support-trigger="true">support.sellytics@gmail.com</a></p>
    <p class="trademark">The term 'Etsy' is a trademark of Etsy, Inc. This Application uses Etsy's API, but is not endorsed or certified by Etsy.</p>
  </footer>

  <script src="app.js"></script>
  <script src="support.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
